import org.jetbrains.kotlin.gradle.dsl.JvmTarget

plugins {
    alias(libs.plugins.android.application)
    alias(libs.plugins.kotlin.android)
    alias(libs.plugins.kotlin.compose)
    alias(libs.plugins.kotlin.serialization)
    id 'kotlin-parcelize'
    id 'kotlin-kapt'
    id 'com.google.dagger.hilt.android'
    id 'com.diffplug.spotless'
    id 'io.gitlab.arturbosch.detekt'
    id 'checkstyle'
}

android {
    namespace 'sangiorgi.wps.opensource'
    compileSdk = 36

    defaultConfig {
        applicationId "com.wpsa.tester"
        minSdk 24
        targetSdk 36
        versionCode 1
        versionName "1.0.0"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    // Release signing configuration:
    // Precedence: Environment variables -> keystore.properties -> gradle properties.
    def keystoreProps = new Properties()
    def keystorePropsFile = rootProject.file("keystore.properties")
    if (keystorePropsFile.exists()) {
        keystorePropsFile.withInputStream { is -> keystoreProps.load(is) }
    }

    def releaseStoreFile = System.getenv("WPS_KEYSTORE_FILE") ?: System.getenv("KEYSTORE_FILE") ?: keystoreProps.getProperty("storeFile") ?: project.findProperty("KEYSTORE_FILE")
    def releaseStorePass = System.getenv("WPS_KEYSTORE_PASSWORD") ?: System.getenv("KEYSTORE_PASSWORD") ?: keystoreProps.getProperty("storePassword") ?: project.findProperty("KEYSTORE_PASSWORD")
    def releaseKeyAlias = System.getenv("WPS_KEY_ALIAS") ?: System.getenv("KEY_ALIAS") ?: keystoreProps.getProperty("keyAlias") ?: project.findProperty("KEY_ALIAS")
    def releaseKeyPass = System.getenv("WPS_KEY_PASSWORD") ?: System.getenv("KEY_PASSWORD") ?: keystoreProps.getProperty("keyPassword") ?: project.findProperty("KEY_PASSWORD")

    def hasReleaseSigning = releaseStoreFile != null &&
            releaseStorePass != null && !releaseStorePass.toString().trim().isEmpty() &&
            releaseKeyAlias != null && !releaseKeyAlias.toString().trim().isEmpty() &&
            releaseKeyPass != null && !releaseKeyPass.toString().trim().isEmpty()

    signingConfigs {
        release {
            if (hasReleaseSigning) {
                storeFile file(releaseStoreFile)
                storePassword releaseStorePass
                keyAlias releaseKeyAlias
                keyPassword releaseKeyPass
            }
        }
    }

    buildTypes {
        debug {
            // Generate JaCoCo coverage for unit tests (createOpenDebugUnitTestCoverageReport).
            enableUnitTestCoverage true
        }
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            if (hasReleaseSigning) {
                signingConfig signingConfigs.release
            }
        }
    }

    gradle.taskGraph.whenReady { taskGraph ->
        def isBuildingRelease = taskGraph.allTasks.any {
            it.name.equalsIgnoreCase("assembleOpenRelease") ||
            it.name.equalsIgnoreCase("assembleRelease") ||
            it.name.equalsIgnoreCase("bundleOpenRelease") ||
            it.name.equalsIgnoreCase("bundleRelease")
        }
        if (isBuildingRelease && !hasReleaseSigning) {
            throw new GradleException(
                "Release signing credentials are not configured.\n" +
                "Fill storePassword and keyPassword in keystore.properties or set environment variables (WPS_KEYSTORE_PASSWORD / KEYSTORE_PASSWORD)."
            )
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }
    tasks.withType(JavaCompile).configureEach {
        options.compilerArgs << "-Xlint:deprecation" << "-Xlint:unchecked"
    }
    kotlin {
        compilerOptions {
            jvmTarget.set(JvmTarget.JVM_11)
        }
    }
    buildFeatures {
        compose true
        buildConfig true
    }
    testOptions {
        unitTests {
            // Let android.util.Log calls return defaults instead of throwing in JVM unit tests.
            returnDefaultValues = true
        }
    }
    packaging {
        jniLibs {
            // WpsConnectionLibrary executes bundled helper binaries from the app's nativeLibDir.
            useLegacyPackaging = true
        }
    }
    flavorDimensions += "version"
    productFlavors {
        open {
            dimension = "version"
            applicationId = "com.wpsa.tester"

            resValue "string", "app_name", "WPS/A Tester"
            buildConfigField "String", "DATA_DIR", "\"/data/data/com.wpsa.tester/\""
        }
    }
}

dependencies {

    implementation libs.androidx.core.ktx
    implementation libs.androidx.core.splashscreen
    implementation libs.androidx.lifecycle.runtime.ktx
    implementation libs.androidx.activity.compose
    implementation platform(libs.androidx.compose.bom)
    implementation libs.androidx.ui
    implementation libs.androidx.ui.graphics
    implementation libs.androidx.ui.tooling.preview
    implementation libs.androidx.material3

    // Compose additional
    implementation libs.androidx.compose.material.icons.extended
    implementation libs.androidx.lifecycle.viewmodel.compose
    implementation libs.androidx.lifecycle.runtime.compose
    implementation libs.androidx.navigation.compose

    // Hilt for dependency injection
    implementation libs.hilt.android
    kapt libs.hilt.compiler
    implementation libs.androidx.hilt.navigation.compose

    // Coroutines
    implementation libs.kotlinx.coroutines.android

    // Kotlin Serialization (for type-safe navigation)
    implementation libs.kotlinx.serialization.json

    // LibSu for root operations
    implementation libs.core
    implementation libs.service
    implementation libs.nio

    testImplementation libs.junit
    testImplementation libs.mockito.core
    testImplementation libs.mockito.kotlin
    testImplementation libs.kotlinx.coroutines.test
    androidTestImplementation libs.androidx.junit
    androidTestImplementation libs.androidx.espresso.core
    androidTestImplementation platform(libs.androidx.compose.bom)
    androidTestImplementation libs.androidx.ui.test.junit4
    debugImplementation libs.androidx.ui.tooling
    debugImplementation libs.androidx.ui.test.manifest
}
